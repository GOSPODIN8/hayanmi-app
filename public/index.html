<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hayanmi</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Manrope:wght@400;600;700&display=swap">
  <style>
    :root {
      --bg: #0E0F0C; --card: #17181A; --card2: #202226; --line: #2C2E33;
      --text: #F3F1EA; --muted: #A6A59E; --accent: #D4F25A;
      --protein: #86B6FF; --fat: #F4A259; --carbs: #E6DFCC;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font-family: Manrope, "Segoe UI", system-ui, sans-serif;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom, 0px));
      min-height: 100vh;
    }
    .display { font-family: Unbounded, "Arial Black", sans-serif; font-weight: 700; }
    .muted { color: var(--muted); }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    header .hello { font-size: 13px; }
    header h1 { margin: 2px 0 0; font-size: 22px; }
    .status { font-size: 12px; padding: 6px 10px; border-radius: 999px; background: var(--card); }
    .status.ok { color: var(--accent); }
    .card { background: var(--card); border-radius: 24px; padding: 18px; margin-bottom: 12px; }
    .ring-wrap { display: flex; gap: 18px; align-items: center; }
    .ring { position: relative; width: 148px; height: 148px; flex-shrink: 0; }
    .ring .center {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 2px;
    }
    .ring .num { font-size: 28px; }
    .ring .lbl { font-size: 12px; }
    .macros { flex: 1; display: flex; flex-direction: column; gap: 12px; }
    .macro .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
    .bar { height: 6px; border-radius: 3px; background: var(--line); }
    .bar > div { height: 6px; border-radius: 3px; width: 0; }
    .cta { text-align: center; padding: 24px 18px; }
    .cta p { margin: 0 0 16px; line-height: 1.5; }
    button.primary {
      width: 100%; height: 56px; border: none; border-radius: 16px;
      background: var(--accent); color: var(--bg);
      font: 700 17px Manrope, "Segoe UI", sans-serif; cursor: pointer;
    }
    button.primary:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <header>
    <div>
      <div class="hello muted" id="hello">Привет!</div>
      <h1 class="display">Сегодня</h1>
    </div>
    <div class="status" id="status">Проверка…</div>
  </header>

  <section class="card ring-wrap" aria-label="Калории за день">
    <div class="ring">
      <svg width="148" height="148" viewBox="0 0 148 148" aria-hidden="true">
        <circle cx="74" cy="74" r="62" fill="none" stroke="#2C2E33" stroke-width="12"></circle>
        <circle cx="74" cy="74" r="62" fill="none" stroke="#D4F25A" stroke-width="12"
                stroke-linecap="round" stroke-dasharray="0 390" transform="rotate(-90 74 74)"></circle>
      </svg>
      <div class="center">
        <div class="num display">—</div>
        <div class="lbl muted">ккал осталось</div>
      </div>
    </div>
    <div class="macros">
      <div class="macro"><div class="row"><span>Белки</span><span class="muted">0 г</span></div><div class="bar"><div style="background: var(--protein)"></div></div></div>
      <div class="macro"><div class="row"><span>Жиры</span><span class="muted">0 г</span></div><div class="bar"><div style="background: var(--fat)"></div></div></div>
      <div class="macro"><div class="row"><span>Углеводы</span><span class="muted">0 г</span></div><div class="bar"><div style="background: var(--carbs)"></div></div></div>
    </div>
  </section>

  <section class="card cta">
    <p>Ответь на несколько вопросов — и Hayanmi рассчитает твою дневную норму калорий и БЖУ.</p>
    <button class="primary" id="start">Рассчитать норму</button>
  </section>

  <script>
    const tg = window.Telegram?.WebApp;
    const statusEl = document.getElementById("status");

    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor("#0E0F0C"); tg.setBackgroundColor("#0E0F0C"); } catch (e) {}
    }

    const firstName = tg?.initDataUnsafe?.user?.first_name;
    if (firstName) document.getElementById("hello").textContent = "Привет, " + firstName + "!";

    // Проверяем на сервере, что приложение открыто из Telegram
    async function checkLogin() {
      if (!tg || !tg.initData) {
        statusEl.textContent = "Откройте через бота";
        return;
      }
      try {
        const res = await fetch("/api/me", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ initData: tg.initData }),
        });
        const data = await res.json();
        if (data.ok) {
          statusEl.textContent = "Подключено";
          statusEl.classList.add("ok");
        } else {
          statusEl.textContent = "Ошибка входа";
        }
      } catch (e) {
        statusEl.textContent = "Нет связи";
      }
    }
    checkLogin();

    document.getElementById("start").addEventListener("click", () => {
      tg?.HapticFeedback?.impactOccurred("light");
      const msg = "Анкета появится на следующем шаге разработки.";
      if (tg?.showAlert) tg.showAlert(msg); else alert(msg);
    });
  </script>
</body>
</html>
